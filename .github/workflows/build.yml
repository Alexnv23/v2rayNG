name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    # ===== SuperNet: ОДИН libv2ray.aar = Xray-core (AndroidLibXrayLite) + olcRTC (mobile) =====
    # Два отдельных gomobile-AAR нельзя: дублируются go.Seq/go.Universe и libgojni.so.
    # Рецепт — как в venterum/veil compile-libv2ray.sh. Готовый AAR кэшируется по коммитам.
    - name: Checkout olcRTC (pinned)
      uses: actions/checkout@v7
      with:
        repository: openlibrecommunity/olcrtc
        ref: 189d16c093c4f721376afb5eaa0213d132a11242
        path: olcrtc
        fetch-depth: 1

    - name: Setup Go (from olcrtc go.mod)
      uses: actions/setup-go@v5
      with:
        go-version-file: olcrtc/go.mod
        cache: false

    - name: Compute native lib cache key
      run: |
        ALXL_SHA=$(git -C AndroidLibXrayLite rev-parse HEAD)
        OLCRTC_SHA=$(git -C olcrtc rev-parse HEAD)
        echo "ALXL_SHA=$ALXL_SHA" >> $GITHUB_ENV
        echo "OLCRTC_SHA=$OLCRTC_SHA" >> $GITHUB_ENV
        echo "AndroidLibXrayLite=$ALXL_SHA olcrtc=$OLCRTC_SHA"

    - name: Restore cached libv2ray.aar (xray+olcrtc)
      id: cache-libv2ray-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/aar-out
        key: libv2ray-olcrtc-v2-${{ runner.os }}-${{ env.ALXL_SHA }}-${{ env.OLCRTC_SHA }}

    - name: Build combined libv2ray.aar (gomobile bind xray + olcrtc)
      if: steps.cache-libv2ray-restore.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        export ANDROID_NDK_HOME="$NDK_HOME"
        WS="${{ github.workspace }}"
        BUILD_DIR="$WS/libv2ray-build"
        mkdir -p "$BUILD_DIR/assets" "$WS/aar-out"

        # Гео-базы: ровно те же три файла, что качает 2dust перед сборкой своего AAR.
        # Без geoip-only-cn-private.dat xray падает на правиле "private -> direct".
        ASSETS="$WS/AndroidLibXrayLite/assets"
        mkdir -p "$ASSETS"
        curl -fsSL https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat -o "$ASSETS/geoip.dat"
        curl -fsSL https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat -o "$ASSETS/geosite.dat"
        curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip-only-cn-private.dat -o "$ASSETS/geoip-only-cn-private.dat"
        ls -la "$ASSETS"
        for f in geoip.dat geosite.dat geoip-only-cn-private.dat; do
          test -s "$ASSETS/$f" || { echo "ASSET MISSING: $f"; exit 1; }
        done
        ln -sfn "$ASSETS/"* "$BUILD_DIR/assets/"

        MOBILE_VER=$(grep 'golang.org/x/mobile' "$WS/olcrtc/go.mod" | awk '{print $2}')
        cat > "$BUILD_DIR/go.mod" <<EOF
        module libv2ray

        go 1.26.3

        require (
            github.com/2dust/AndroidLibXrayLite v0.0.0
            github.com/openlibrecommunity/olcrtc v0.0.0
            golang.org/x/mobile $MOBILE_VER
        )

        replace github.com/2dust/AndroidLibXrayLite => $WS/AndroidLibXrayLite

        replace github.com/openlibrecommunity/olcrtc => $WS/olcrtc

        $(sed -n '/^replace /p' "$WS/AndroidLibXrayLite/go.mod")
        EOF

        cat > "$BUILD_DIR/imports.go" <<'EOF'
        package libv2ray

        import (
            _ "github.com/2dust/AndroidLibXrayLite"
            _ "github.com/openlibrecommunity/olcrtc/mobile"
        )
        EOF

        cd "$BUILD_DIR"
        go mod tidy
        echo "---- resolved go.mod ----"
        cat go.mod

        # gomobile той же версии, что x/mobile в итоговом go.mod (иначе seq-рантайм может разъехаться)
        GOMOBILE_VER=$(grep -m1 'golang.org/x/mobile' go.mod | awk '{print $2}')
        echo "gomobile: $GOMOBILE_VER  ndk: $ANDROID_NDK_HOME"
        go install golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VER
        go install golang.org/x/mobile/cmd/gobind@$GOMOBILE_VER
        export PATH="$(go env GOPATH)/bin:$PATH"
        gomobile init
        go version
        gomobile version

        gomobile bind \
          -target=android \
          -androidapi 24 \
          -ldflags "-s -w -checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384" \
          -o "$WS/aar-out/libv2ray.aar" \
          github.com/2dust/AndroidLibXrayLite \
          github.com/openlibrecommunity/olcrtc/mobile

        ls -la "$WS/aar-out/"
        unzip -l "$WS/aar-out/libv2ray.aar" | grep -E 'assets/|\.so$|classes\.jar' || true
        # Жёсткая проверка: все три гео-базы обязаны лежать в AAR, иначе апп не стартует
        for f in geoip.dat geosite.dat geoip-only-cn-private.dat; do
          unzip -l "$WS/aar-out/libv2ray.aar" | grep -q "assets/$f" || { echo "AAR MISSING assets/$f"; exit 1; }
        done
        echo "AAR OK: xray+olcrtc + 3 geo assets"

    - name: Save cached libv2ray.aar
      if: steps.cache-libv2ray-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/aar-out
        key: libv2ray-olcrtc-v2-${{ runner.os }}-${{ env.ALXL_SHA }}-${{ env.OLCRTC_SHA }}

    - name: Copy libv2ray.aar into app
      run: |
        mkdir -p "${{ github.workspace }}/V2rayNG/app/libs"
        rm -f "${{ github.workspace }}/V2rayNG/app/libs/olcrtc.aar"
        cp "${{ github.workspace }}/aar-out/libv2ray.aar" "${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar"
        ls -la "${{ github.workspace }}/V2rayNG/app/libs/"
    # ===== /SuperNet =====

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleDebug
    
    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/debug/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/debug/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/debug/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/debug/*universal*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/v2rayN-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
